<style>
  /* Compact pill with icon-only buttons; the selected one has a ring, the others are greyed out. */
  /* Wrapper fills the header height and centres the pill vertically, like the search field and the Slack link. */
  .theme-switch-wrap { display: flex; align-items: center; height: 100%; padding-right: 0.75rem; }
  .theme-switch {
    display: inline-flex; align-items: center; height: 32px;
    border: 1px solid #e6e6e6; border-radius: 9999px;
  }
  [data-theme="dark"] .theme-switch { border-color: #323232; }
  .theme-switch button {
    appearance: none; display: inline-flex; align-items: center; justify-content: center;
    box-sizing: border-box; width: 32px; height: 32px; margin: -1px; padding: 0;
    border: 1px solid transparent; border-radius: 9999px; background: transparent;
    color: #8f8f8f; cursor: pointer; transition: color 0.15s;
  }
  .theme-switch button:hover { color: inherit; }
  .theme-switch button svg { width: 18px; height: 18px; }
  .theme-switch button[aria-checked="true"] { color: inherit; border-color: #e6e6e6; }
  [data-theme="dark"] .theme-switch button[aria-checked="true"] { border-color: #5c5c5c; }
</style>
<div class="theme-switch-wrap">
<div class="theme-switch" role="radiogroup" aria-label="Theme">
  <button type="button" data-theme-choice="system" role="radio" aria-checked="false" aria-label="System" title="System">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25m18 0A2.25 2.25 0 0 0 18.75 3H5.25A2.25 2.25 0 0 0 3 5.25m18 0V12a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 12V5.25"/></svg>
  </button>
  <button type="button" data-theme-choice="light" role="radio" aria-checked="false" aria-label="Light" title="Light">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg>
  </button>
  <button type="button" data-theme-choice="dark" role="radio" aria-checked="false" aria-label="Dark" title="Dark">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/></svg>
  </button>
</div>
</div>
<script>
  (function () {
    var buttons = document.querySelectorAll('.theme-switch [data-theme-choice]');
    function render() {
      var pref = window.idpTheme.preference();
      buttons.forEach(function (b) {
        b.setAttribute('aria-checked', b.getAttribute('data-theme-choice') === pref);
      });
    }
    buttons.forEach(function (b) {
      b.addEventListener('click', function () {
        window.idpTheme.set(b.getAttribute('data-theme-choice'));
        render();
      });
    });
    render();
  })();
</script>
